name: campus-dist

# Builds the trainer for Calliope Campus, which serves it itself as its
# KI-Training editor under /editors/ki-training/ on its own origin
# (calliope-campus docs/editors.md), and pushes the build to the `campus-dist`
# branch: one commit per build of `feat-calliope`, the build output at its root
# plus CAMPUS-BUILD.json naming the source commit. Campus pins a commit of that
# branch as its editors/ki-training submodule and moves the pin by hand
# ("bump ki-training editor"), so nothing built here reaches campus.calliope.cc
# unreviewed.
#
# The branch only ever grows: Campus release tags pin its older commits, so
# rewriting it would break their builds.

on:
  push:
    branches:
      - feat-calliope
  workflow_dispatch:

# One build after the other, so every push lands on the branch in order.
concurrency:
  group: campus-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall generates the Chakra theme typings the type check needs.
      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          # Vite's base: every asset and route is prefixed with this path.
          BASE_URL: /editors/ki-training/
          # The canonical link, og:image and favicon in index.html.
          VITE_FULL_URL: /editors/ki-training/
          VITE_STAGE: PRODUCTION
          # Leaves out the go.calliope.cc consent/analytics script and styles
          # (vite.config.ts): on Campus's origin it would run with Campus's rights.
          CAMPUS_DIST: "1"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Push the build to campus-dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short=${SOURCE_SHA:0:7}
          mkdir campus-dist && cd campus-dist
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin campus-dist; then
            git checkout -q -b campus-dist FETCH_HEAD
          else
            git checkout -q --orphan campus-dist
          fi
          git rm -rqf --ignore-unmatch .
          cp -r ../dist/. .
          # A page for trying things out by hand, not part of the trainer.
          rm -f test.html
          # Build output, kept byte for byte: no line-ending conversion on checkout.
          printf '# Build output, kept byte for byte (no line-ending conversion on checkout).\n* -text\n' > .gitattributes
          printf '{\n  "source": "%s",\n  "branch": "%s",\n  "base": "/editors/ki-training/",\n  "built": "%s"\n}\n' \
            "$SOURCE_SHA" "$SOURCE_REF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > CAMPUS-BUILD.json
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build ${short} from ${SOURCE_REF}" -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}"
          git push -q origin campus-dist
          echo "### campus-dist: build ${short} from ${SOURCE_REF}" >> "$GITHUB_STEP_SUMMARY"
